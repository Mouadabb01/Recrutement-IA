# ==========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.application.name=recrutement-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/recrut
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
# Clé secrète de signature JWT (Doit faire au moins 256 bits, soit 32 octets / 64 caractères hexa)
# Générez une clé sécurisée ou utilisez celle-ci par défaut pour le développement local
jwt.secret=9a4f2c8d3b7a1e5f8c3d2e1a7b8f9c0e2d1f4a5b6c7d8e9f0a1b2c3d4e5f6a7b
# Durée de validité du token (1 jour = 86400000 ms)
jwt.expiration=86400000

# ==========================================
# AI INTEGRATION (Gemini API)
# ==========================================
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Permettre l'envoi de requêtes multipart (pour les uploads de CV si on le souhaite)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
